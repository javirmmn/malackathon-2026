  <text class="s" x="335" y="216" text-anchor="middle">apoyo frase a frase</text>

  <rect class="opt" x="470" y="110" width="190" height="120" rx="12"/>
  <text class="t" x="565" y="150" text-anchor="middle">Jueces</text>
  <text class="s" x="565" y="176" text-anchor="middle">LLM local (Ollama)</text>
