  <text class="s" x="565" y="216" text-anchor="middle">(opcionales, con caché)</text>

  <rect class="box" x="700" y="110" width="190" height="120" rx="12"/>
  <text class="t" x="795" y="150" text-anchor="middle">Combinación</text>
  <text class="s" x="795" y="176" text-anchor="middle">regresión logística</text>
  <text class="s" x="795" y="196" text-anchor="middle">umbral para la métrica</text>
  <text class="s" x="795" y="216" text-anchor="middle">del ranking</text>

  <rect class="box" x="930" y="110" width="196" height="120" rx="12"/>
  <text class="t" x="1028" y="150" text-anchor="middle">Veredicto</text>
  <text class="s" x="1028" y="176" text-anchor="middle">alucina sí / no</text>
  <text class="s" x="1028" y="196" text-anchor="middle">probabilidad</text>
  <text class="s" x="1028" y="216" text-anchor="middle">+ motivos</text>

  <path class="l" d="M200,170 H236"/><path class="l" d="M430,170 H466"/>
  <path class="l" d="M660,170 H696"/><path class="l" d="M890,170 H926"/>

  <rect class="out" x="700" y="290" width="190" height="80" rx="10"/>
  <text class="s" x="795" y="322" text-anchor="middle" font-weight="700">modelo.json</text>
  <text class="s" x="795" y="344" text-anchor="middle">sin reentrenar (sorpresa)</text>
  <path class="d" d="M795,230 V286"/>
  <rect class="out" x="930" y="290" width="196" height="80" rx="10"/>
  <text class="s" x="1028" y="322" text-anchor="middle" font-weight="700">Entrega + dashboard</text>
  <text class="s" x="1028" y="344" text-anchor="middle">CSV ranking · informe</text>
  <path class="d" d="M1028,230 V286"/>
  <rect class="out" x="240" y="16" width="190" height="64" rx="10"/>
  <text class="s" x="335" y="42" text-anchor="middle" font-weight="700">sin red ni GPU</text>
