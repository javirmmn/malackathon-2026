<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5cad"/>
    </marker>
    <style>
      .box{fill:#e8f1fb;stroke:#0b5cad;stroke-width:2}
      .out{fill:#fff;stroke:#5b6475;stroke-width:1.5;stroke-dasharray:6 4}
      .opt{fill:#fff7e0;stroke:#e0a21f;stroke-width:1.5}
      .t{font-size:20px;font-weight:700;fill:#1d2433}
      .s{font-size:14px;fill:#5b6475}
      .l{stroke:#0b5cad;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .d{stroke:#5b6475;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="box" x="10" y="110" width="190" height="120" rx="12"/>
  <text class="t" x="105" y="150" text-anchor="middle">Entrada</text>
  <text class="s" x="105" y="176" text-anchor="middle">respuesta de la IA</text>
  <text class="s" x="105" y="196" text-anchor="middle">+ fuentes</text>
  <text class="s" x="105" y="216" text-anchor="middle">(CSV · JSON · bot)</text>

  <rect class="box" x="240" y="110" width="190" height="120" rx="12"/>
  <text class="t" x="335" y="150" text-anchor="middle">Señales baratas</text>
